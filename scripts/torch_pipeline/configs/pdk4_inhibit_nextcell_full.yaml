# NextCell (NVIDIA grammar): PDK4 inhibit, 2000 OM6+OM9 (80y) targets, 3 YM2 (34y)
# context cells chosen evenly_spaced across pseudotime. The OM target supplies its
# pseudotime to form Delta_t_query = round(ptime(OM) - ptime(ctx_3)); the OM cell
# itself is NOT fed to the prompt. Baseline vs perturbed differ ONLY in whether
# ctx_3 (the last YM2 context cell) carries the PDK4 inhibit edit.
#
# Prompt: <bos> c1 <eos> Dt_12 <bos> c2 <eos> Dt_23 <bos> c3 <eos>
#         <boq> Dt_q <eoq>  <bos>(sentinel)
# Model autoregressively emits:  <bos> g_1 ... <eos>  (= generated future cell)
data:
  h5ad: ./data/zero_shot/rna_zero_shot.preprocessed.h5ad
  pseudotime_col: Pseudotime
  group_col: sample
  cell_id_col: null              # obs_names
  count_col: nCount_RNA

context:
  strategy: pool
  max_cells: 3
  ordering: pseudotime
  pool_filter:
    age: [34]                    # YM2 only (1989 cells)
  pool_select:
    n: 3
    pick: evenly_spaced
    sort_by: pseudotime
    seed: 0

query:
  strategy: each_cell
  filter_obs:
    age: [80]                    # OM6 + OM9 → ~2000 queries

perturbation:
  gene_symbol: PDK4
  gene: null
  direction: inhibit
  apply_to: query

seq_length: 16384
task_type: next_cell

generation:
  max_tokens: 4096               # NVIDIA documented default
  top_k: 1                       # greedy for deterministic paired comparison (§6 pin)
  top_p: 0.0
  temperature: 1.0
  buffer_size_gb: 40.0           # NVIDIA documented default
  buffer_guaranteed_fraction: 0.1
  chunk_size_tokens: 4096
  buffer_overflow_factor: 50.0   # upstream default
