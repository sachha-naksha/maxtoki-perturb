# NextCell: PDK4 inhibit, 2000 OM6+OM9 (80y) queries, 3 YM2 (34y) context cells
# chosen evenly_spaced across the 34y pseudotime trajectory. Matches the §6 pinned
# experiment in deltaai/AGENT_NEXTCELL.md.
data:
  h5ad: ./data/zero_shot/rna_zero_shot.preprocessed.h5ad
  pseudotime_col: Pseudotime
  group_col: sample
  cell_id_col: null              # obs_names
  count_col: nCount_RNA

context:
  strategy: pool
  max_cells: 3
  ordering: pseudotime
  pool_filter:
    age: [34]                    # YM2 only (1989 cells)
  pool_select:
    n: 3
    pick: evenly_spaced
    sort_by: pseudotime
    seed: 0

query:
  strategy: each_cell
  filter_obs:
    age: [80]                    # OM6 + OM9 → ~2000 queries

perturbation:
  gene_symbol: PDK4
  gene: null
  direction: inhibit
  apply_to: query

seq_length: 16384
task_type: next_cell

generation:
  max_tokens: 2048
  top_k: 1                       # greedy
  top_p: 0.0
  temperature: 1.0
  buffer_size_gb: 20.0
  buffer_guaranteed_fraction: 0.1
  chunk_size_tokens: 4096
  buffer_overflow_factor: 50.0   # upstream default; prevents TokenOverflowError on multi-request batches
