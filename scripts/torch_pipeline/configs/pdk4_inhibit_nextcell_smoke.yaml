# NextCell SMOKE: 20 queries deterministically sub-sampled from the 2000-row
# OM6+OM9 (80y) full pool. Full-run prompt settings (seq_length=16384, 3 YM2
# evenly-spaced context cells, 2048 generation cap). Mirrors
# pdk4_inhibit_nextcell_full.yaml exactly except for query.limit_n + query.seed.
data:
  h5ad: ./data/zero_shot/rna_zero_shot.preprocessed.h5ad
  pseudotime_col: Pseudotime
  group_col: sample
  cell_id_col: null
  count_col: nCount_RNA

context:
  strategy: pool
  max_cells: 3
  ordering: pseudotime
  pool_filter:
    age: [34]
  pool_select:
    n: 3
    pick: evenly_spaced
    sort_by: pseudotime
    seed: 0

query:
  strategy: each_cell
  filter_obs:
    age: [80]
  limit_n: 20                    # deterministic smoke subset
  seed: 42

perturbation:
  gene_symbol: PDK4
  gene: null
  direction: inhibit
  apply_to: query

seq_length: 16384
task_type: next_cell

generation:
  max_tokens: 2048
  top_k: 1
  top_p: 0.0
  temperature: 1.0
  buffer_size_gb: 20.0
  buffer_guaranteed_fraction: 0.1
  chunk_size_tokens: 4096
  buffer_overflow_factor: 1.0
